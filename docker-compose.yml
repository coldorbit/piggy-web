services:
  api:
    build:
      context: ./api
    environment:
      NODE_ENV: production
      WEB_PORT: 4000
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-3000}
      CORS_ORIGINS: http://localhost:${CLIENT_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-dev-only-change-me}
      WEB_USERS: ${WEB_USERS:-}
      WEB_USERNAME: ${WEB_USERNAME}
      WEB_PASSWORD: ${WEB_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-amqp://applypilot:change-me@rabbitmq:5672}
      TAILORING_QUEUE_NAME: ${TAILORING_QUEUE_NAME:-applypilot.tailoring}
      MAILBOX_EMAIL: ${MAILBOX_EMAIL:-service@co-bounce.com}
      MAILBOX_PASSWORD: ${MAILBOX_PASSWORD:-}
      MAILBOX_IMAP_HOST: ${MAILBOX_IMAP_HOST:-mail.privateemail.com}
      MAILBOX_IMAP_PORT: ${MAILBOX_IMAP_PORT:-993}
      MAILBOX_IMAP_SECURE: ${MAILBOX_IMAP_SECURE:-true}
    ports:
      - 0.0.0.0:${API_PORT:-4000}:4000
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-300}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-amqp://applypilot:change-me@rabbitmq:5672}
      TAILORING_QUEUE_NAME: ${TAILORING_QUEUE_NAME:-applypilot.tailoring}
      TAILORING_CONCURRENCY: ${TAILORING_CONCURRENCY:-4}
      TAILORING_MAX_ATTEMPTS: ${TAILORING_MAX_ATTEMPTS:-3}
      TAILORING_STALE_PROCESSING_SECONDS: ${TAILORING_STALE_PROCESSING_SECONDS:-600}
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    init: true

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-applypilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - 127.0.0.1:${RABBITMQ_PORT:-5672}:5672
      - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${API_PORT:-4000}}
    ports:
      - 0.0.0.0:${CLIENT_PORT:-3000}:80
    depends_on:
      - api
    init: true

volumes:
  rabbitmq_data:
