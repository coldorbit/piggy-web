name: Deploy Tailoring Workers

on:
  workflow_dispatch:
    inputs:
      hosts_json:
        description: 'JSON array of worker hosts. Leave blank to use WORKER_HOSTS_JSON.'
        required: false
        default: ''

  push:
    branches:
      - main
    paths:
      - worker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-tailoring-workers.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-tailoring-workers-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.WORKER_GHCR_IMAGE_NAME || 'applypilot-tailoring-worker' }}
  CONTAINER_NAME: ${{ vars.WORKER_CONTAINER_NAME || 'applypilot-tailoring-worker' }}
  ENV_FILE: ${{ vars.WORKER_ENV_FILE || '/opt/applypilot/env/worker.env' }}
  DOCKER_NETWORK: applypilot

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}
      hosts_json: ${{ steps.hosts.outputs.hosts_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve worker hosts
        id: hosts
        env:
          INPUT_HOSTS_JSON: ${{ inputs.hosts_json }}
          VAR_HOSTS_JSON: ${{ vars.WORKER_HOSTS_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          hosts_json="${INPUT_HOSTS_JSON:-$VAR_HOSTS_JSON}"

          if [ -z "$hosts_json" ]; then
            echo 'WORKER_HOSTS_JSON is required.' >&2
            echo 'Example: ["123.123.123.123"]' >&2
            exit 1
          fi

          echo "$hosts_json" | jq -e \
            'type == "array"
             and length > 0
             and all(.[]; type == "string" and length > 0)' \
            >/dev/null

          echo "hosts_json=$hosts_json" >> "$GITHUB_OUTPUT"

      - name: Set image ref
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "image=ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

          echo "latest=ghcr.io/${owner}/${IMAGE_NAME}:latest" \
            >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          pull: true
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.build.outputs.hosts_json) }}

    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy worker container
        env:
          SSH_USER: ${{ vars.WORKER_SSH_USER || 'deploy' }}
          HOST: ${{ matrix.host }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$HOST" \
            "GHCR_USER='$GHCR_USER' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             IMAGE='$IMAGE' \
             CONTAINER_NAME='$CONTAINER_NAME' \
             ENV_FILE='$ENV_FILE' \
             DOCKER_NETWORK='$DOCKER_NETWORK' \
             bash -s" <<'REMOTE'

          set -euo pipefail

          echo "$GHCR_TOKEN" \
            | docker login ghcr.io \
                -u "$GHCR_USER" \
                --password-stdin

          docker pull "$IMAGE"

          # Required for RabbitMQ container DNS.
          docker network inspect "$DOCKER_NETWORK" >/dev/null

          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network "$DOCKER_NETWORK" \
            --env-file "$ENV_FILE" \
            "$IMAGE"

          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
            echo "Worker container failed to start." >&2
            docker logs --tail 200 "$CONTAINER_NAME" >&2 || true
            exit 1
          fi

          echo "Worker container is running."
          docker ps --filter "name=$CONTAINER_NAME"

          docker image prune -f
          REMOTE